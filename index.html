<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Position Sizer</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* ── Theme variables ── */
        :root {
            --bg:       #000;
            --surface:  #0d0d0d;
            --surface2: #050505;
            --surface3: #0a0a0a;
            --border:   #1a1a1a;
            --border2:  #222;
            --border3:  #111;
            --text:     #fff;
            --muted:    #555;
            --muted2:   #444;
            --muted3:   #333;
            --accent:   #00ff88;
            --danger:   #ff4444;
            --warn:     #cc7700;
            --pill-bg:  #1a1a1a;
            --hover-bg: #0f0f0f;
            --res-grad: linear-gradient(145deg, #0a0a0a, #111);
            --shadow:   rgba(0,0,0,0.9);
            --overlay:  rgba(0,0,0,0.92);
        }
        body.light {
            --bg:       #f0f0f0;
            --surface:  #ffffff;
            --surface2: #f7f7f7;
            --surface3: #f0f0f0;
            --border:   #e0e0e0;
            --border2:  #d0d0d0;
            --border3:  #e8e8e8;
            --text:     #111;
            --muted:    #777;
            --muted2:   #999;
            --muted3:   #bbb;
            --accent:   #00994d;
            --danger:   #cc2200;
            --warn:     #b35c00;
            --pill-bg:  #e8e8e8;
            --hover-bg: #f0f0f0;
            --res-grad: linear-gradient(145deg, #f5f5f5, #ececec);
            --shadow:   rgba(0,0,0,0.12);
            --overlay:  rgba(0,0,0,0.5);
        }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', monospace; display: flex; justify-content: center; margin: 0; padding: 15px; transition: background 0.2s, color 0.2s; }
        .box { width: 100%; max-width: 380px; background: var(--surface); padding: 20px; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 40px var(--shadow); }

        .header { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h2 { margin: 0; font-size: 10px; color: var(--muted2); letter-spacing: 1.5px; text-transform: uppercase; }
        .btn-group { display: flex; gap: 6px; margin-bottom: 6px; }
        .btn { background: var(--pill-bg); color: var(--muted); border: 1px solid var(--border2); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 10px; font-weight: bold; text-transform: uppercase; flex: 1; text-align: center; }
        .btn:active { background: var(--accent); color: #000; }
        .btn-reset { color: var(--warn); }
        .btn-manage { color: var(--accent); }
        .theme-btn { background: var(--pill-bg); border: 1px solid var(--border2); border-radius: 6px; padding: 5px 7px; cursor: pointer; display: flex; align-items: center; color: var(--muted); }
        .theme-btn:hover { color: var(--accent); border-color: var(--accent); }

        label { color: var(--muted); font-size: 9px; display: block; margin-top: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        input {
            width: 100%; padding: 12px; background: var(--surface2); border: 1px solid var(--border2); color: var(--accent);
            font-size: 1.1rem; border-radius: 6px; font-family: monospace; margin-top: 4px;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 10px rgba(0,0,0,0.05); }

        /* Custom Dropdown */
        .custom-select { position: relative; margin-top: 4px; }
        .custom-select-trigger {
            width: 100%; padding: 12px; background: var(--surface2); border: 1px solid var(--border2); color: var(--accent);
            font-size: 1.1rem; border-radius: 6px; font-family: monospace; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            user-select: none; transition: border-color 0.15s;
        }
        .custom-select.open .custom-select-trigger {
            border-color: var(--accent); box-shadow: 0 0 10px rgba(0,0,0,0.05);
            border-bottom-left-radius: 0; border-bottom-right-radius: 0;
        }
        .custom-select-chevron {
            font-size: 10px; color: var(--accent); transition: transform 0.2s ease; flex-shrink: 0; margin-left: 8px;
        }
        .custom-select.open .custom-select-chevron { transform: rotate(180deg); }
        .custom-select-options {
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--surface2); border: 1px solid var(--accent); border-top: none;
            border-bottom-left-radius: 6px; border-bottom-right-radius: 6px;
            z-index: 100; overflow: hidden;
            max-height: 0; opacity: 0; pointer-events: none;
            transition: max-height 0.2s cubic-bezier(0.4,0,0.2,1), opacity 0.15s ease;
        }
        .custom-select.open .custom-select-options {
            max-height: 200px; opacity: 1; pointer-events: all;
        }
        .custom-select-option {
            padding: 12px; font-family: monospace; font-size: 1rem; color: var(--muted2);
            cursor: pointer; border-top: 1px solid var(--border3); transition: background 0.1s, color 0.1s;
        }
        .custom-select-option:hover { background: var(--hover-bg); color: var(--accent); }
        .custom-select-option.selected { color: var(--accent); }

        #suggestions { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 4px; scrollbar-width: none; }
